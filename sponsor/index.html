<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsor @wwang721</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon_io/site.webmanifest">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9f9f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #222;
    }

    .card {
      text-align: center;
      padding: 3rem 0.5rem 2rem;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.07);
      max-width: 750px;
      width: 90%;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 1.25rem;
      object-fit: cover;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      letter-spacing: -0.3px;
    }

    .handle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 0.9rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #26975b, #08a2e4);
      border-radius: 2px;
      margin: 1.8rem auto;
    }

    .tagline {
      font-size: 1rem;
      color: #555;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .tagline span.green { color: #26975b; font-weight: 600; }
    .tagline span.blue  { color: #08a2e4; font-weight: 600; }

    .qr-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
    }

    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
    }

    .qr-item img {
      height: min(400px, 40vw);
      width: auto;
      display: block;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .qr-label {
      font-size: 0.82rem;
      color: #999;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .footer {
      font-size: 0.78rem;
      color: #bbb;
      margin-top: 1.8rem;
    }

    .handle a {
      color: #888;
      text-decoration: none;
    }

    .handle a:hover { color: #08a2e4; }

    .footer a {
      color: #aaa;
      text-decoration: none;
    }

    .footer a:hover { color: #08a2e4; }

    @media (max-width: 900px) {
      .qr-row { flex-direction: column; align-items: center; }
      .qr-item img { height: auto; width: min(300px, 80vw); }
    }

    @media (prefers-color-scheme: dark) {
      body        { background: #121212; color: #e0e0e0; }
      .card       { background: #1e1e1e; box-shadow: 0 4px 32px rgba(0, 0, 0, 0.4); }
      .handle     { color: #aaa; }
      .handle a   { color: #aaa; }
      .tagline    { color: #bbb; }
      .qr-item img{ border-color: #444; filter: brightness(0.85) contrast(1.05); }
      .qr-label   { color: #888; }
      .footer     { color: #666; }
      .footer a   { color: #777; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      class="avatar"
      src="https://avatars.githubusercontent.com/wwang721"
      alt="@wwang721 avatar"
      onerror="this.style.display='none'"
    />

    <h1>Wei Wang</h1>
    <p class="handle"><a href="https://github.com/wwang721" target="_blank" rel="noopener">@wwang721</a> on GitHub</p>

    <div class="divider"></div>

    <p class="tagline">
      <span class="green">Sponsor the author</span>
      <span class="blue"> if you like the contents!</span>
    </p>

    <div class="qr-row">
      <div class="qr-item">
        <img src="wechat.JPG" alt="WeChat Pay QR code" />
        <span class="qr-label">WeChat Pay</span>
      </div>
      <div class="qr-item">
        <img src="alipay.JPG" alt="Alipay QR code" />
        <span class="qr-label">Alipay</span>
      </div>
    </div>

    <p class="footer">

      &nbsp;·&nbsp; Thank you for your support <span style="color:#ea4aaa;">♥</span>
    </p>
  </div>
</body>
</html>
